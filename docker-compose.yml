name: back-q-bank

services:
  postgres:
    image: postgres:18
    container_name: qbank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qbank
      POSTGRES_PASSWORD: qbank
      POSTGRES_DB: qbank
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql (not .../data).
      - qbank_pg:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qbank -d qbank']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qbank_pg:
